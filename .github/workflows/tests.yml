name: Tests
run-name: Running unit tests
on: [push, pull_request]

jobs:
  python_tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov
      
      - name: Compile C library
        run: |
          make lib
      
      - name: Compile main executable
        run: |
          make
      
      - name: Run Python unit tests
        run: |
          python3 test/test_xor.py
          python3 test/test_aes.py
          python3 test/test_main.py
      
      - name: Run tests with pytest (if available)
        run: |
          if command -v pytest &> /dev/null; then
            pytest test/ -v --tb=short || echo "pytest tests completed with issues"
          else
            echo "pytest not available, skipping advanced tests"
          fi

  integration_tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker
    needs: python_tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Compile the program
        run: |
          make
      
      - name: Test executable functionality
        run: |
          if [ ! -x my_pgp ]; then
            echo "Executable my_pgp not found"
            exit 1
          fi
          
          echo "Testing basic help/usage..."
          ./my_pgp --help || ./my_pgp -h || echo "Help command tested"
          
          if [ -f message ] && [ -f key256bits ]; then
            echo "Testing XOR encryption/decryption..."
            ./my_pgp -c xor -i message -k key256bits -o test_output || echo "XOR test attempted"
            
            echo "Testing AES encryption/decryption..."
            ./my_pgp -c aes-256-cbc -i message -k key256bits -o test_aes_output || echo "AES test attempted"
          else
            echo "Test files not found, skipping file-based tests"
          fi

  build_verification:
    name: Build Verification
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Clean and rebuild
        run: |
          make clean
          make
      
      - name: Verify build artifacts
        run: |
          if [ ! -f lib/libcipher.so ]; then
            echo "AES library not built"
            exit 1
          fi
          
          if [ ! -x my_pgp ]; then
            echo "Executable not built"
            exit 1
          fi
          
          echo "Build verification passed"
          ls -la lib/libcipher.so my_pgp