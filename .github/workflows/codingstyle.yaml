name: Coding Style
on: [push, pull_request]

jobs:
  coding_style:
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker
    steps:
      - uses: actions/checkout@v4
      - name: Check EPITECH coding style
        run: |
          curl -sL https://github.com/Epitech/coding-style-checker/releases/latest/download/coding-style-checker.sh -o coding-style-checker.sh
          chmod +x coding-style-checker.sh
          ./coding-style-checker.sh $(pwd) $(pwd)
          if [ -s coding-style-reports.log ]; then
            cat coding-style-reports.log
            exit 1
          fi