name: Style Check Check
run-name: Checking coding style compliance
on: [push, pull_request]

jobs:
  python_coding_style:
    name: Python Coding Style
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install coding style tools
        run: |
          pip install flake8 pylint
      
      - name: Check PEP8 compliance with flake8
        run: |
          flake8 src/ --max-line-length=80 --ignore=E501,W503,E203 \
                      --exclude=__pycache__,*.pyc,.git \
                      --statistics --count
      
      - name: Check code quality with pylint
        run: |
          pylint src/ --fail-under=6.0 --disable=C0114,C0115,C0116,R0903,E0401

  c_coding_style:
    name: C Coding Style
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install C coding style tools
        run: |
          apt-get update
          apt-get install -y cppcheck clang-format
      
      - name: Static analysis with cppcheck
        run: |
          cppcheck src/aes/ --enable=all --error-exitcode=1 \
                           --suppress=missingIncludeSystem \
                           --suppress=unusedFunction \
                           --force --std=c99

  header_check:
    name: Check EPITECH Headers
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Verify EPITECH headers in source files
        run: |
          missing_headers=""
          for file in $(find src/ -name "*.c" -o -name "*.h" -o -name "*.py"); do
            if ! head -5 "$file" | grep -q "EPITECH PROJECT"; then
              missing_headers="$missing_headers $file"
            fi
          done
          
          if [ ! -z "$missing_headers" ]; then
            echo "Missing EPITECH headers in files: $missing_headers"
            exit 1
          fi
          echo "All source files have proper EPITECH headers"